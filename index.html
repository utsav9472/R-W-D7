<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <link rel="stylesheet" href="syle.css">
</head>

<body>
    <div id="container">
        <div id="header">
            <p id="header1">Multi-Effect UI Showcase</p>
            <p id="headertext">All Section Styled without Flexbox</p>
        </div>
        <p
            style="font-size: 20px; text-align: center; padding: 35px; margin-bottom: 10px; font-weight:600; background-color: white">
            Layered Profile Card</p>
        <div id="imgcontainer">

            <div id="img1">
                <img id="girl" src="girl.png">
                <p style="text-align: center; font-size: 20px;">Alice</p>
                <p style="text-align: center; font-size: 15px; margin-top: 15px;">Ui/Ux Designer</p>
            </div>
            <div id="img2">
                <img id="girl" src="boy.jpg">
                <p style="text-align: center; font-size: 20px;">Bob</p>
                <p style="text-align: center; font-size: 15px; margin-top: 15px;">Full Stack Developer</p>
            </div>
        </div>
        <p
            style="font-size: 20px; text-align: center; padding: 35px; margin-bottom: 10px; font-weight:600; background-color:white;">
            Quiz Flashcard</p>
        <div id="flashcard">
            <div id="flash1">
                <p>What is HTML ?</p>


            </div>
            <div id="flash2">
                <p>What is CSS ?</p>

            </div>

        </div>
        <p
            style="font-size: 20px; text-align: center; padding: 35px; margin-bottom: 10px; font-weight:600; background-color:white;">
            Creative Buttons</p>
        <div id="btncontainer">
            <button id="button1">Slide Button</button>
            <button id="button2">Glow Button</button>
        </div>
        <p
            style="font-size: 20px; text-align: center; padding: 35px; margin-bottom: 10px; font-weight:600; background-color: white;">
            Interactive Image Gallery</p>
        <div id="galleryfooter">
            <div id="gallery1">
                <img id="gallery" src="g1.jpg">
            </div>
            <div id="gallery2">
                <img id="gallery" src="g2.jpg">
            </div>
            <div id="gallery3">
                <img id="gallery" src="g3.jpg">
            </div>
        </div>
</body>

</html>
